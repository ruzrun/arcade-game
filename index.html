<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Raa's Arcade 🎮</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-hearts">

        <span>💕</span>
        <span>💗</span>
        <span>💖</span>
        <span>💘</span>
        <span>💝</span>
        <span>💕</span>
        <span>💗</span>
        <span>💖</span>

    </div>

    <main class="arcade-container">

        <header class="arcade-header">

            <p class="small-title">
                WELCOME TO
            </p>

            <h1>
                Raa's Arcade 🎮
            </h1>

            <p class="subtitle">
                A little place made just for you 💕
            </p>

        </header>

        <section class="welcome-card">

            <div class="controller">
                🎮
            </div>

            <h2>
                Choose Your Game
            </h2>

            <p>
                Take a little break and play something made with love 💌
            </p>

        </section>

        <a
             href="https://ruzrun.github.io/LETTERs.-FOR.-YOU./"
             class="back-to-letter">

           💌 Back to My Letters

        </a>

        <section
            class="games-container"
            id="gamesContainer">

        </section>

        <footer>

            <p>
                Made with love for Raa 💕
            </p>

            <p class="footer-small">
                More games coming soon...
            </p>

        </footer>

    </main>

    <script src="script.js"></script>

</body>
</html>
